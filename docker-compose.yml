services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: pqrs-postgres:16-pgvector
    container_name: pqrs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pqrs}
      POSTGRES_USER: ${POSTGRES_USER:-pqrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pqrs}
    ports:
      # 5433 por defecto: en Windows suele existir otro Postgres en 5432 y las conexiones no llegan al contenedor.
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pqrs} -d ${POSTGRES_DB:-pqrs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pqrs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: pqrs-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  ollama_data:
