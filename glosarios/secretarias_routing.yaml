multidependencias:
  - trigger: [colegio, violencia]
    secretarias: [SED, SGO, SMU]
  - trigger: [hueco, vía, niño]
    secretarias: [SIF, SMO, SIS]
  - trigger: [inundación, barrio]
    secretarias: [DAGRD, SIF, SMA]
