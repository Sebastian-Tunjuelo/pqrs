repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^(contexts|orchestration|shared-kernel|e2e|scripts)/.*\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^(contexts|orchestration|shared-kernel|e2e|scripts)/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        files: ^contexts/presentation/.*\.(tsx|ts|jsx|js|css|json)$

  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --manifest-path contexts/api/Cargo.toml --
        language: system
        pass_filenames: false
