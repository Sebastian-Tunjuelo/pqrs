[project]
name = "pqrs-ingestion"
version = "0.1.0"
description = "Ingestion bounded context for PQRS Medellin"
requires-python = ">=3.11"
dependencies = [
  "pqrs-shared-kernel>=0.1.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pandas>=2.2",
  "pydantic>=2.8",
  "redis>=5.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
