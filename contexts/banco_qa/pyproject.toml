[project]
name = "pqrs-banco-qa"
version = "0.1.0"
description = "Builder / seed del banco Q&A para PQRS Medellín"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
embedding = [
  "sentence-transformers>=2.2.0",
  "torch>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["banco_qa*"]
