[project]
name = "pqrs-warehouse"
version = "0.1.0"
description = "Warehouse bounded context for PQRS Medellin"
requires-python = ">=3.11"
dependencies = [
  "pqrs-shared-kernel>=0.1.0",
  "duckdb>=1.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["warehouse*"]
